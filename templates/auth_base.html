{% extends "base.html" %}
{% block body %}
<main id="main" class="auth-page">
  <div class="auth-card card shadow-sm">
    <div class="card-body p-4 p-sm-5">
      <div class="text-center mb-4">
        <div class="auth-logo" aria-hidden="true"><i class="bi bi-shield-check"></i></div>
        <h1 class="h4 mb-1">SMS Guard</h1>
        <p class="text-body-secondary small mb-0">Проверка SMS и ссылок на мошенничество</p>
      </div>
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
      {% block auth_content %}{% endblock %}
    </div>
  </div>
</main>
{% endblock %}
