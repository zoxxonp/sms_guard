{# Поле формы с подписью, подсказкой и ошибкой на русском рядом с полем (НФТ-11) #}
<div class="mb-3">
  <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
         class="form-control{% if field.errors %} is-invalid{% endif %}"
         {% if field.value and field.field.widget.input_type != 'password' %}value="{{ field.value }}"{% endif %}
         {% for name, value in field.field.widget.attrs.items %}{% if value is True %} {{ name }}{% elif value is not False %} {{ name }}="{{ value }}"{% endif %}{% endfor %}
         {% if field.field.required %}required{% endif %}
         {% if field.errors %}aria-invalid="true" aria-describedby="{{ field.id_for_label }}-error"{% elif field.help_text %}aria-describedby="{{ field.id_for_label }}-help"{% endif %}>
  {% if field.errors %}
    <div class="invalid-feedback d-block" id="{{ field.id_for_label }}-error">
      {% for error in field.errors %}<div>{{ error }}</div>{% endfor %}
    </div>
  {% elif field.help_text %}
    <div class="form-text" id="{{ field.id_for_label }}-help">{{ field.help_text }}</div>
  {% endif %}
</div>
